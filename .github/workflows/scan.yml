name: scan
on:
  schedule:
    - cron: '0 2 * * 0'      # Sunday: full topic enumeration (catches departures,
                             # old repos newly carrying the topic, and quiet renames)
    - cron: '0 2 * * 1-6'    # Mon-Sat: delta discovery, only repos pushed recently
  workflow_dispatch:
    inputs:
      discovery:
        description: 'Topic discovery mode'
        type: choice
        default: 'full'
        options:
          - full
          - delta
          - skip
      probe_only:
        description: 'Validate the first 100 catalog repositories without committing site data'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: scheduled-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - name: scanner dependencies
        run: npm ci --prefix scanner --ignore-scripts
      # The per-repo cards drive incremental scanning. Keeping them in the cache
      # rather than in git stops a 35MB tree from being rewritten every day; a
      # cache miss just means one slower full sweep.
      - uses: actions/cache/restore@v6
        with:
          path: data/scans
          key: scans-${{ github.run_id }}
          restore-keys: scans-
      - name: rule tests
        run: |
          npm --prefix scanner test
          python scanner/test_scan_core.py
          python -m unittest discover -s scanner -p 'test_*.py'
      - name: discover
        if: github.event_name != 'workflow_dispatch' || inputs.discovery != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mode="${{ inputs.discovery }}"
          if [ -z "$mode" ]; then
            # Search API answers 30 requests/minute, so full enumeration is
            # inherently sleep-paced; GITHUB_EVENT_SCHEDULE carries the cron
            # that fired and Sunday's is the one allowed to pay for it.
            if [ "$GITHUB_EVENT_SCHEDULE" = "0 2 * * 0" ]; then mode=full; else mode=delta; fi
          fi
          if [ "$mode" = "delta" ]; then
            python scanner/discover.py delta
          else
            python scanner/discover.py all
          fi
      - name: scan + render
        env:
          XRAY_PROBE_ONLY: ${{ inputs.probe_only }}
        run: |
          if [ "$XRAY_PROBE_ONLY" = "true" ]; then
            cd scanner && python pipeline.py 100 8
            exit 0
          fi
          # Recollect every old-schema card; a budget must not strand old evidence.
          # Each analysis request owns its Node process and stdio streams.
          # The budget caps how many repos are fetched in one run: normally
          # unused (a day's pushes fit well under it), but after a cache miss
          # it bounds the run and the remaining cards converge over the
          # following days instead of blowing the job timeout.
          cd scanner && python pipeline.py all 16 2500
          python render_report.py
          python render_docs.py
          python render_i18n_defaults.py
          python render_pages.py
          python render_registry.py
      - name: commit results
        if: inputs.probe_only != true
        run: |
          git config user.name 'dsh-xray-bot'
          git config user.email 'bot@dsh-xray'
          git add data docs
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          git commit -m "scan: refresh $(date -u +%F)"
          # A push landing during the scan would otherwise reject ours and throw
          # away the whole run, so rebase and retry before giving up.
          for attempt in 1 2 3; do
            git fetch origin master
            if git rebase origin/master && git push; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "push failed after 3 attempts - conflicting changes need a human"
          exit 1

      - name: preserve collected cards
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/scans
          key: scans-${{ github.run_id }}

      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Without this a broken scan just leaves the site on stale data quietly.
          existing=$(gh issue list --label scan-failure --state open --limit 1 --json number --jq '.[0].number')
          body="The scheduled scan failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          The site is serving the previous scan until this is fixed."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Scheduled scan failed" --label scan-failure --body "$body"
          fi
