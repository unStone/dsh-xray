name: scan
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: discover + scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scanner/discover.py all
          # all repos, 12 workers, at most 1500 fetched per run: unchanged repos
          # reuse cached cards, so daily runs converge to full coverage and then
          # stay cheap. Downloads go to codeload, not the API quota.
          cd scanner && python pipeline.py all 12 1500
          python render_report.py
      - name: commit results
        run: |
          git config user.name 'dsh-xray-bot'
          git config user.email 'bot@dsh-xray'
          git add data docs
          git diff --cached --quiet || git commit -m "scan: refresh $(date -u +%F)"
          git push
