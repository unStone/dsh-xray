<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-xray — X-ray for agent plugins</title>
<meta name="description" content="Capability cards for every DeepSeek Harness plugin: declared permissions vs actual behavior, with file:line evidence.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

<nav class="nav">
  <a class="brand" href="./">dsh-<span>xray</span></a>
  <div class="links">
    <a href="registry.html" data-i18n="nav.registry">Registry</a>
    <a href="https://github.com/unStone/dsh-xray" data-i18n="nav.github">GitHub</a>
  </div>
  <div class="chips" id="langSwitch"></div>
</nav>

<div class="hero">
  <h1 data-i18n="hero.title">X-ray for agent plugins</h1>
  <p class="sub" data-i18n="hero.sub"></p>
  <div class="ctas">
    <a class="btn pri" href="registry.html" data-i18n="hero.cta1"></a>
    <a class="btn sec" href="#badge" data-i18n="hero.cta2"></a>
  </div>
  <p class="stat" id="liveStat"></p>
</div>

<section>
  <h2 data-i18n="why.title"></h2>
  <p class="lead" data-i18n="why.p"></p>
  <div class="cards">
    <div class="card"><div class="n">01</div><h3 data-i18n="card1.t"></h3><p data-i18n="card1.b"></p></div>
    <div class="card"><div class="n">02</div><h3 data-i18n="card2.t"></h3><p data-i18n="card2.b"></p></div>
    <div class="card"><div class="n">03</div><h3 data-i18n="card3.t"></h3><p data-i18n="card3.b"></p></div>
  </div>
</section>

<section>
  <h2 data-i18n="how.title"></h2>
  <div class="cards">
    <div class="card"><div class="n">1</div><h3 data-i18n="how.s1t"></h3><p data-i18n="how.s1b"></p></div>
    <div class="card"><div class="n">2</div><h3 data-i18n="how.s2t"></h3><p data-i18n="how.s2b"></p></div>
    <div class="card"><div class="n">3</div><h3 data-i18n="how.s3t"></h3><p data-i18n="how.s3b"></p></div>
  </div>
</section>

<section>
  <h2 data-i18n="levels.title"></h2>
  <div class="lvl-row"><span class="lvl-tag" style="background:var(--c0)">C0</span><p data-i18n="levels.l0"></p></div>
  <div class="lvl-row"><span class="lvl-tag" style="background:var(--c1)">C1</span><p data-i18n="levels.l1"></p></div>
  <div class="lvl-row"><span class="lvl-tag" style="background:var(--c2)">C2</span><p data-i18n="levels.l2"></p></div>
  <div class="lvl-row"><span class="lvl-tag" style="background:var(--c3)">C3</span><p data-i18n="levels.l3"></p></div>
  <p class="note" data-i18n="levels.note"></p>
</section>

<section id="badge">
  <h2 data-i18n="badge.title"></h2>
  <p class="lead" data-i18n="badge.b"></p>
  <div class="badge-demo"><span class="l">dsh-xray</span><span class="r">C2 · 4 flags</span></div>
  <code class="snippet">[![dsh-xray](https://img.shields.io/endpoint?url=https%3A%2F%2Funstone.github.io%2Fdsh-xray%2Fbadge%2F&lt;owner&gt;__&lt;repo&gt;.json)](https://unstone.github.io/dsh-xray/registry.html#&lt;owner&gt;__&lt;repo&gt;)</code>
</section>

<section>
  <h2 data-i18n="teams.title"></h2>
  <p class="lead" data-i18n="teams.b"></p>
  <p style="margin-top:14px"><a class="btn sec" href="https://github.com/unStone/dsh-xray#roadmap" data-i18n="teams.cta"></a></p>
</section>

<footer>
  <span data-i18n="foot.oss"></span> <a href="https://github.com/unStone/dsh-xray/issues" data-i18n="foot.issue"></a>
</footer>
</div>

<script src="i18n.js"></script>
<script>
xray.applyStatic();
xray.mountSwitcher(document.getElementById('langSwitch'));
fetch('data.json').then(r => r.json()).then(d => {
  const ok = d.plugins.filter(p => p.level >= 0);
  const c = l => ok.filter(p => p.level === l).length;
  document.getElementById('liveStat').textContent = xray.t('hero.stat', {
    scanned: d.scanned, c3: c(3), c2: c(2), date: d.generated_at.slice(0, 16).replace('T', ' ')
  });
}).catch(() => {});
</script>
</body>
</html>
